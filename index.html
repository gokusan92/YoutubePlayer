    <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Player</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    /* Custom Styles (if needed, but minimizing direct CSS) */
  </style>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

  <div class="container mx-auto p-4">
    <div class="bg-black rounded-lg shadow-lg overflow-hidden">

      <div class="py-2 px-4 text-white text-center">
        YouTube Player
      </div>

      <div class="bg-white aspect-w-16 aspect-h-9">
        <iframe id="youtube-iframe" width="100%" height="100%" src="" frameborder="0" allowfullscreen></iframe>
      </div>

      <div class="bg-black py-3 px-4 flex items-center justify-around">
        <button id="play-button" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded inline-flex items-center">
          <span>Play</span>
        </button>

        <input type="text" id="youtube-link-input" placeholder="Type youtube link" class="shadow appearance-none border rounded w-1/2 py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">

        <button id="stop-button" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded inline-flex items-center">
          <span>Stop</span>
        </button>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
    <script>document.addEventListener('DOMContentLoaded', () => {
  const playButton = document.getElementById('play-button');
  const stopButton = document.getElementById('stop-button');
  const youtubeLinkInput = document.getElementById('youtube-link-input');
  const youtubeIframe = document.getElementById('youtube-iframe');

  // O(1) lookup for valid YouTube URL
  const youtubeRegex = /^(?:https?:\/\/)?(?:m\.|www\.)?(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))((\w|-){11})(?:\S+)?$/;

  let currentVideoId = null; // Store the currently playing video ID

  // Play Button Click Handler
  playButton.addEventListener('click', () => {
    const youtubeLink = youtubeLinkInput.value;

    // Input Validation (Edge Case: Empty Input)
    if (!youtubeLink) {
      alert('Please enter a YouTube link.');
      return; // Early exit
    }

    const match = youtubeLink.match(youtubeRegex);

    if (!match || !match[1]) {
        alert("Invalid YouTube link. Please provide a valid link.");
        return;
    }

    const videoId = match[1];

    // Update the iframe source (Atomic update)
    youtubeIframe.src = `https://www.youtube.com/embed/${videoId}`;
    currentVideoId = videoId; // Update the current video ID
  });

  // Stop Button Click Handler
  stopButton.addEventListener('click', () => {
    // Edge case: Stop clicked when no video is playing
    if (!currentVideoId) {
      alert('No video is currently playing.');
      return;
    }

    // Stop the video by setting the source to empty
    youtubeIframe.src = '';
    currentVideoId = null; // Reset current video ID
    youtubeLinkInput.value = ''; // Clear the input field for better UX
  });
});</script>
</body>
</html>
